name: Deploy backend

# Deploys the FastAPI backend to Fly.io when backend code lands on main.
# Needs the FLY_API_TOKEN repository secret (`fly tokens create deploy -x 999999h`).
# The frontend deploys through Vercel's GitHub integration, not from here.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
