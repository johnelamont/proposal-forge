name: Deploy backend

# Deploys the FastAPI backend to Fly.io when backend code lands on main.
# Needs the FLY_API_TOKEN repository secret (`fly tokens create deploy -x 999999h`).
# The frontend deploys through Vercel's GitHub integration, not from here.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip until FLY_API_TOKEN is configured
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN not set; skipping deploy (see docs/DEPLOYMENT.md)"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only
        if: env.FLY_API_TOKEN != ''
